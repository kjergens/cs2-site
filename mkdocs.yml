site_name: CS2 — Columbia Grammar
site_author: Katie Jergens
docs_dir: docs

theme:
  name: readthedocs

extra_javascript:
  - js/nav_scroll_fix.js

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      linenums: false
  - pymdownx.superfences
  - tables
  - admonition
  - attr_list

nav:
  - Table of Contents: index.md
  - Unit 1 — Java Review and Arrays:
    - "1.1 Java Review": unit1/notes_01_java_review.md
    - "1.2 Loops": unit1/notes_02_loops.md
    - "1.3 Introduction to Arrays": unit1/notes_03_arrays.md
    - "1.4 Traversing Arrays": unit1/notes_04_traversing_arrays.md
  - Unit 2 — Methods:
    - "2.1 Introduction to Methods": unit2/notes_01_methods.md
    - "2.2 Method Parameters": unit2/notes_02_method_parameters.md
    - "2.3 Return Values": unit2/notes_03_return_values.md
    - "2.4 Arrays as Parameters": unit2/notes_04_arrays_as_parameters.md
    - "2.5 Method Overloading": unit2/notes_05_method_overloading.md
    - "Project 1: TextAnalyzer": unit2/project1.md
  - Unit 3 — Introduction to Objects:
    - "3.1 Introduction to Objects": unit3/notes_01_intro_to_objects.md
    - "3.2 Constructors": unit3/notes_02_constructors.md
    - "3.3 Instance Methods": unit3/notes_03_instance_methods.md
  - Unit 4 — Objects Advanced:
    - "4.1 Encapsulation and Getters": unit4/notes_01_encapsulation.md
    - "4.2 Setters": unit4/notes_02_getters_setters.md
  - Unit 5 — Images and Color:
    - "5.1 Color and BufferedImage": unit5/notes_01_color_and_bufferedimage.md
    - "5.2 Traversing Images": unit5/notes_02_traversing_images.md
    - "5.3 Image Effects": unit5/notes_03_image_effects.md
    - "Project 2: FotoFun": unit5/project2.md
